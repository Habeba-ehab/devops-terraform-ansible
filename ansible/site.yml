---
- name: Prepare all servers
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: Wait until SSH is ready
      ansible.builtin.wait_for_connection:
        timeout: 300
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - storage
    - docker

- name: Database server
  hosts: db
  become: true
  roles:
    - postgres
    - backup

- name: Application server
  hosts: app
  become: true
  roles:
    - app