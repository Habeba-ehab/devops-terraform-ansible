- name: Create Postgres compose directory
  file:
    path: "{{ postgres_compose_dir }}"
    state: directory
    mode: "0755"

- name: Create backup directory
  file:
    path: "{{ backup_dir }}"
    state: directory
    mode: "0755"

- name: Template init.sql
  template:
    src: init.sql.j2
    dest: "{{ postgres_compose_dir }}/init.sql"
    mode: "0600"

- name: Template docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ postgres_compose_dir }}/docker-compose.yml"
    mode: "0600"

- name: Template restore script
  template:
    src: pg_restore.sh.j2
    dest: /usr/local/bin/pg_restore.sh
    mode: "0755"

- name: Start Postgres container
  community.docker.docker_compose_v2:
    project_src: "{{ postgres_compose_dir }}"
    state: present

- name: Wait for Postgres container to be healthy
  command: docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' postgres
  register: pg_health
  until: pg_health.stdout == "healthy"
  retries: 20
  delay: 3
  changed_when: false