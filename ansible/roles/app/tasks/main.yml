- name: Create app compose directory
  file:
    path: "{{ app_compose_dir }}"
    state: directory
    mode: "0755"

- name: Copy app folder to server
  copy:
    src: "{{ playbook_dir }}/../app/"
    dest: "{{ app_compose_dir }}/app/"

- name: Build app Docker image
  community.docker.docker_image:
    name: "{{ app_image }}"
    source: build
    build:
      path: "{{ app_compose_dir }}/app"
    state: present

- name: Template nginx.conf
  template:
    src: nginx.conf.j2
    dest: "{{ app_compose_dir }}/nginx.conf"
    mode: "0644"

- name: Template docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_compose_dir }}/docker-compose.yml"
    mode: "0600"

- name: Wait for Postgres on DB host to be ready
  wait_for:
    host: "{{ db_host }}"
    port: "{{ db_port }}"
    timeout: 60

- name: Start app and Nginx with Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ app_compose_dir }}"
    state: present
